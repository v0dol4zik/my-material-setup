# Цвета mpv из палитры Noctalia. Подключается из mpv.conf через include.
# Генерируется Noctalia из ~/.config/noctalia/templates/mpv.conf в
# ~/.config/mpv/noctalia.conf при каждой смене палитры: править шаблон, а не результат.
#
# Всегда берётся тёмный вариант палитры (.dark): OSC и субтитры лежат поверх
# видео, светлая подложка на кадре читается плохо. Акцент при этом свой.

# Субтитры и OSD: светлый текст с тёмной обводкой, тень полупрозрачная (#AARRGGBB).
sub-color="{{colors.on_surface.dark.hex}}"
sub-outline-color="{{colors.background.dark.hex}}"
sub-shadow-color="#80{{colors.background.dark.hex_stripped}}"
osd-color="{{colors.on_surface.dark.hex}}"
osd-outline-color="{{colors.background.dark.hex}}"

# OSC. timecode_color красит и таймкоды, и полосу перемотки.
script-opts-append="osc-background_color={{colors.surface.dark.hex}}"
script-opts-append="osc-title_color={{colors.on_surface.dark.hex}}"
script-opts-append="osc-timecode_color={{colors.primary.dark.hex}}"
script-opts-append="osc-time_pos_color={{colors.on_surface.dark.hex}}"
script-opts-append="osc-time_pos_outline_color={{colors.background.dark.hex}}"
script-opts-append="osc-buttons_color={{colors.on_surface.dark.hex}}"
script-opts-append="osc-top_buttons_color={{colors.on_surface.dark.hex}}"
script-opts-append="osc-small_buttonsL_color={{colors.on_surface.dark.hex}}"
script-opts-append="osc-small_buttonsR_color={{colors.on_surface.dark.hex}}"
script-opts-append="osc-held_element_color={{colors.primary.dark.hex}}"

# Консоль и меню выбора (`, Ctrl+p, g p…), контекстное меню (правая кнопка).
script-opts-append="console-focused_color={{colors.on_primary.dark.hex}}"
script-opts-append="console-focused_back_color={{colors.primary.dark.hex}}"
script-opts-append="console-match_color={{colors.tertiary.dark.hex}}"
script-opts-append="context_menu-focused_color={{colors.on_primary.dark.hex}}"
script-opts-append="context_menu-focused_back_color={{colors.primary.dark.hex}}"
script-opts-append="context_menu-disabled_color={{colors.outline.dark.hex}}"
