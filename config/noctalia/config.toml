[shell]
polkit_agent = true
font_family = "Roboto"
corner_radius_scale = 0.25
button_borders = false
input_borders = true
popup_borders = false
popup_shadows = true
card_borders = false

[shell.animation]
enabled = true
speed = 1.1

[theme]
source = "custom"
custom_palette = "Material2-Green"
mode = "dark"
shell_mode = "follow"
pure_black_dark = false

[wallpaper]
transition = [ "fade" ]
transition_duration = 250.0

[bar]
order = [ "main" ]

[bar.main]
position = "top"
enabled = true
auto_hide = false
reserve_space = true
layer = "top"

# Material 2 app bar, flush with the screen edges.
thickness = 40
background_opacity = 0.78
border = "outline"
border_width = 0.0
shadow = false
radius = 0
margin_ends = 0
margin_edge = 0
margin_opposite_edge = 0
padding = 16
widget_spacing = 8
scale = 1.0
font_weight = 500
hover_highlight = true

# One translucent surface; no extra opaque capsule around system widgets.
capsule = false
start = [ "launcher", "workspaces" ]
center = [ "clock" ]
end = [ "tray", "notifications", "network", "volume", "battery", "control-center" ]

[widget.workspaces]
style = "minimal"

[widget.clock]
format = "{:%a, %d %b · %H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.tray]
drawer = true
drawer_columns = 3
drawer_item_size = 20
detached_panel = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.battery]
display_mode = "glyph"
show_label = false

[widget.notifications]
hide_when_no_unread = true

[notification]
scale = 0.88
background_opacity = 0.88
border = false
layer = "overlay"
offset_x = 12
offset_y = 12
max_visible = 2
collapse_on_dismiss = true
show_app_name = true
# Clicking a toast still invokes its default action; history is unchanged.
show_actions = false

# Material 2 shapes with translucent surfaces and soft elevation shadows.
[shell.panel]
transparency_mode = "glass"
borders = false
shadow = true
control_center_placement = "attached"
open_near_click_control_center = true
launcher_placement = "floating"
launcher_position = "center"
floating_offset = 12
list_item_background = false

[shell.launcher]
compact = false
app_grid = true
categories = true
show_icons = true
sort_by_usage = true

[shell.shadow]
# A lighter, balanced shadow keeps glass panel edges from looking like a dark slab.
alpha = 0.16
direction = "center"

[control_center]
hidden_tabs = [ "monitor" ]
width = 600
sidebar = "compact"
sidebar_section = "compact"
show_shortcut_labels = false
show_session_button = true

[osd]
enabled = true
position = "top_center"
position_vertical = "top_center"
orientation = "horizontal"
scale = 0.9
background_opacity = 0.86
border = false
offset_x = 16
offset_y = 12

[lockscreen]
enabled = true
blurred_desktop = false
blur_intensity = 0.2
tint_intensity = 0.65
wallpaper = ""

# One compact login box; no weather, media, or session-action clutter.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
visible = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
enabled = true
output = "eDP-1"
box_width = 384.0
box_height = 152.0
cx = 768.0
cy = 518.0
placement_width = 1536.0
placement_height = 864.0
rotation = 0.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
layout = "regular"
background_color = "surface"
background_opacity = 0.86
background_radius = 4.0
input_opacity = 1.0
input_radius = 4.0
center_password_text = false
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_unlock_hint = false
show_session_buttons = false
show_media = false
show_weather = false

[idle]
pre_action_fade_seconds = 2.0
behavior_order = [ "lock", "screen-off" ]

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 1200
action = "screen_off"
enabled = true
