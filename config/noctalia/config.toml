[shell]
polkit_agent = true
corner_radius_scale = 0.92
button_borders = true
input_borders = true
popup_borders = true
popup_shadows = true
card_borders = true

[bar]
order = [ "main" ]

[bar.main]
position = "top"
enabled = true
auto_hide = false
reserve_space = false
layer = "top"

# Compact floating Gruvbox bar.
thickness = 34
background_opacity = 0.75
border = "outline"
border_width = 1.0
shadow = true
radius = 11
margin_ends = 12
margin_edge = 8
margin_opposite_edge = 4
padding = 10
widget_spacing = 5
scale = 0.94
font_weight = 600
hover_highlight = true

# Keep the bar clean; widgets retain Noctalia's native appearance.
capsule = false
start = [ "launcher", "workspaces" ]
center = [ "clock" ]
end = [ "tray", "notifications", "group:status" ]

[[bar.main.capsule_group]]
id = "status"
members = [ "network", "volume", "battery", "control-center" ]
fill = "surface_variant"
padding = 5
radius = 11
opacity = 0.78
enabled = true

[widget.workspaces]
style = "focus_hint"

[widget.clock]
format = "{:%a, %d %b · %H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.tray]
drawer = true
drawer_columns = 3
drawer_item_size = 20
detached_panel = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.battery]
display_mode = "glyph"
show_label = false

[widget.notifications]
hide_when_no_unread = true

[notification]
scale = 0.82
background_opacity = 0.82
layer = "overlay"
offset_x = 12
offset_y = 8
max_visible = 3
collapse_on_dismiss = true
show_app_name = false
show_actions = true

# Unified shell surfaces: Gruvbox glass, consistent outlines and radius.
[shell.panel]
transparency_mode = "glass"
borders = true
shadow = true
control_center_placement = "attached"
launcher_placement = "floating"
launcher_position = "center"
floating_offset = 8
list_item_background = false

[shell.launcher]
compact = true
app_grid = false
categories = true
show_icons = true
sort_by_usage = true

[shell.shadow]
alpha = 0.38
direction = "down"

[control_center]
hidden_tabs = [ "monitor" ]
width = 620
sidebar = "compact"
sidebar_section = "compact"
show_shortcut_labels = false
show_session_button = true

[osd]
enabled = true
position = "top_center"
position_vertical = "top_center"
orientation = "horizontal"
scale = 0.82
background_opacity = 0.82
border = true
offset_x = 12
offset_y = 8

[lockscreen]
enabled = true
blurred_desktop = true
blur_intensity = 0.68
tint_intensity = 0.36
wallpaper = ""

[idle]
pre_action_fade_seconds = 2.0
behavior_order = [ "lock", "screen-off" ]

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 1200
action = "screen_off"
enabled = true
