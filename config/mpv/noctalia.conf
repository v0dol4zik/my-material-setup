# Цвета mpv из палитры Noctalia. Подключается из mpv.conf через include.
# Генерируется Noctalia из ~/.config/noctalia/templates/mpv.conf в
# ~/.config/mpv/noctalia.conf при каждой смене палитры: править шаблон, а не результат.
#
# Всегда берётся тёмный вариант палитры (.dark): OSC и субтитры лежат поверх
# видео, светлая подложка на кадре читается плохо. Акцент при этом свой.

# Субтитры и OSD: светлый текст с тёмной обводкой, тень полупрозрачная (#AARRGGBB).
sub-color="#e8eaed"
sub-outline-color="#1e1e1e"
sub-shadow-color="#801e1e1e"
osd-color="#e8eaed"
osd-outline-color="#1e1e1e"

# OSC. timecode_color красит и таймкоды, и полосу перемотки.
script-opts-append="osc-background_color=#1e1e1e"
script-opts-append="osc-title_color=#e8eaed"
script-opts-append="osc-timecode_color=#25e075"
script-opts-append="osc-time_pos_color=#e8eaed"
script-opts-append="osc-time_pos_outline_color=#1e1e1e"
script-opts-append="osc-buttons_color=#e8eaed"
script-opts-append="osc-top_buttons_color=#e8eaed"
script-opts-append="osc-small_buttonsL_color=#e8eaed"
script-opts-append="osc-small_buttonsR_color=#e8eaed"
script-opts-append="osc-held_element_color=#25e075"

# Консоль и меню выбора (`, Ctrl+p, g p…), контекстное меню (правая кнопка).
script-opts-append="console-focused_color=#082613"
script-opts-append="console-focused_back_color=#25e075"
script-opts-append="console-match_color=#80cbc4"
script-opts-append="context_menu-focused_color=#082613"
script-opts-append="context_menu-focused_back_color=#25e075"
script-opts-append="context_menu-disabled_color=#64696e"
