# mpv — основной конфиг.
# Цвета субтитров, OSD, OSC и меню — из палитры Noctalia: noctalia.conf
# генерирует сама оболочка по шаблону ~/.config/noctalia/templates/mpv.conf.
include="~~/noctalia.conf"

# ── Видео ───────────────────────────────────────────────
# vo=gpu-next уже по умолчанию. Аппаратное декодирование бережёт батарею и
# не греет ноутбук. Прямо vaapi, а не auto-safe: auto сначала пробует Vulkan
# и CUDA, которых на HD 620 нет, и сыплет ошибками в терминал. Кодек, который
# VA-API не умеет, молча уйдёт на процессор.
# Тяжёлые шейдеры и профиль high-quality не включаем: HD 620 начнёт терять кадры.
hwdec=vaapi

# ── Окно ────────────────────────────────────────────────
# Большие видео не больше 90% экрана, маленькие не меньше 40%.
autofit-larger=90%x90%
autofit-smaller=40%x40%
cursor-autohide=1000

# ── Терминал ────────────────────────────────────────────
# Не писать «Applying auto profile» на каждом файле.
msg-level=auto_profiles=warn

# ── Продолжить с того же места ──────────────────────────
# Позиция запоминается при выходе, для аудиофайлов — нет (см. [audio-file]).
# Кроме позиции помним только выбранные дорожки и сдвиг субтитров/звука,
# а не громкость, скорость и прочее, что потом удивляет.
save-position-on-quit=yes
watch-later-options=start,aid,sid,secondary-sid,sub-delay,audio-delay
# История просмотров: g h — открыть список.
save-watch-history=yes

# ── Звук ────────────────────────────────────────────────
volume-max=150
alang=ru,rus,en,eng
# Внешние дорожки рядом с видео и в типичных папках раздач.
audio-file-auto=fuzzy
audio-file-paths=audio:Audio:Sound:RUS Sound:Rus Sound:Звук

# ── Субтитры ────────────────────────────────────────────
slang=ru,rus,en,eng
# Если звук уже на русском, русские субтитры сами не включаются (кроме forced).
subs-with-matching-audio=forced
sub-auto=fuzzy
sub-file-paths=subs:Subs:subtitles:Subtitles:RUS Subs:Rus Subs:Субтитры
sub-font=Roboto
sub-font-size=40
sub-outline-size=2.5
sub-shadow-offset=1

# ── OSD (громкость, перемотка, сообщения) ──────────────
osd-font=Roboto
osd-font-size=30
osd-outline-size=2
osd-bar-h=2
osd-bar-w=60

# ── Скриншоты (клавиша s) ───────────────────────────────
screenshot-dir=~/Изображения/mpv
screenshot-template="%F_%wH-%wM-%wS"
screenshot-format=png

# ── Профили ─────────────────────────────────────────────
[audio-file]
profile-desc=Аудио (в том числе с обложкой): позицию не запоминать
profile-cond=not get("current-tracks/video") or get("current-tracks/video/albumart")
profile-restore=copy
save-position-on-quit=no

[music]
profile-desc=Музыка из терминала: mpv --profile=music ~/Музыка
audio-display=no
shuffle=yes
loop-playlist=inf
term-osd-bar=yes
