# Только отличия от стандартных клавиш: /usr/share/doc/mpv/input.conf
# На русской раскладке все буквенные клавиши работают через scripts/ru-layout.lua.

# Стрелки вверх/вниз — громкость, как в браузерных плеерах.
# Перемотка на минуту переехала на Shift.
UP          add volume  5
DOWN        add volume -5
Shift+UP    seek  60
Shift+DOWN  seek -60
